<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>AurApp</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AurApp">
<meta name="theme-color" content="#FBEAF0">

<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Worlds ------------------------------------------------------------ -->
<div class="screen on" id="s-worlds">
  <div class="bar">
    <h1 data-t="worlds.ask"></h1>
    <div class="grow"></div>
    <div class="pill" id="clockWorlds">⏱ <span>30 min</span></div>
    <button class="round lock" data-go="help" aria-label="Instrucciones">❓</button>
    <button class="round lock" id="lockBtn" aria-label="Papá o mamá">🔒</button>
  </div>
  <div class="worlds" id="worldTiles"></div>
</div>

<!-- Video grid -------------------------------------------------------- -->
<div class="screen" id="s-grid">
  <div class="bar">
    <button class="round" data-go="worlds" aria-label="Inicio">🏠</button>
    <h1 id="gridTitle"></h1>
    <div class="grow"></div>
    <div class="pill" id="clockGrid">⏱ <span></span></div>
  </div>
  <div class="row">
    <button class="arrow" id="prevPage" aria-label="Anterior">‹</button>
    <div class="grid" id="videoGrid"></div>
    <button class="arrow" id="nextPage" aria-label="Siguiente">›</button>
  </div>
  <div class="dots" id="pageDots"></div>
</div>

<!-- Player ------------------------------------------------------------ -->
<div class="screen" id="s-player">
  <div id="stage">
    <div id="ytHost"></div>
    <div class="block"></div>
    <div class="veil" id="veil">▶</div>
  </div>
  <div class="controls">
    <button class="big pink" id="playPause" aria-label="Pausa">⏸</button>
    <div class="track"><div id="progress"></div></div>
    <button class="big lilac" id="playerHome" aria-label="Inicio">🏠</button>
  </div>
</div>

<!-- Time up ----------------------------------------------------------- -->
<div class="screen" id="s-timeup">
  <div class="moon">🌙</div>
  <h2 data-t="timeup.title"></h2>
  <p data-t="timeup.sub"></p>
  <button class="cta" data-go="paint" data-t="timeup.cta"></button>
  <button class="quiet" id="timeupParents" style="margin-top:18px" data-t="timeup.parents"></button>
</div>

<!-- Paint menu -------------------------------------------------------- -->
<div class="screen" id="s-paint">
  <div class="bar">
    <button class="round" data-go="worlds" aria-label="Inicio">🏠</button>
    <h1 data-t="paint.ask"></h1>
  </div>
  <div class="doors">
    <button class="door" data-go="color" style="background:var(--door-1)">
      <svg viewBox="0 0 320 300" id="doorArt" aria-hidden="true"></svg>
      <span class="name" data-t="paint.color"></span>
      <span class="sub" data-t="paint.color.sub"></span>
    </button>
    <button class="door" data-go="draw" style="background:var(--door-2)">
      <svg viewBox="0 0 320 300" aria-hidden="true">
        <path d="M40 200 C90 100 130 250 170 150 C200 76 240 190 285 120"
              fill="none" stroke="var(--ink)" stroke-width="14" stroke-linecap="round" opacity=".75"/>
      </svg>
      <span class="name" data-t="paint.draw"></span>
      <span class="sub" data-t="paint.draw.sub"></span>
    </button>
  </div>
</div>

<!-- Coloring ---------------------------------------------------------- -->
<div class="screen" id="s-color">
  <div class="bar">
    <button class="round" data-go="paint" aria-label="Atrás">‹</button>
    <h1 id="colorTitle" style="font-size:24px"></h1>
    <div class="grow"></div>
  </div>
  <div class="cats" id="silCats"></div>
  <div class="picker" id="silPicker"></div>
  <div id="canvasWrap"><svg id="colorSvg" viewBox="0 0 320 300" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="paintrow">
    <div class="palette" id="palColor"></div>
    <button class="bigreset" id="colorReset" aria-label="Empezar de nuevo">
      <svg id="colorResetArt" viewBox="0 0 320 300" aria-hidden="true"></svg>
      <span class="badge">↺</span>
    </button>
  </div>
</div>

<!-- Free draw --------------------------------------------------------- -->
<div class="screen" id="s-draw">
  <div class="bar">
    <button class="round" data-go="paint" aria-label="Atrás">‹</button>
    <h1 style="font-size:24px" data-t="draw.title"></h1>
    <div class="grow"></div>
    <button class="round" id="undoBtn" aria-label="Deshacer">↶</button>
  </div>
  <div class="tools">
    <button class="tool on" data-tool="pencil" data-t="tool.pencil"></button>
    <button class="tool" data-tool="brush" data-t="tool.brush"></button>
    <button class="tool" data-tool="eraser" data-t="tool.eraser"></button>
    <button class="tool" id="clearDraw" data-t="tool.new"></button>
  </div>
  <div id="canvasWrap2" style="flex:1;background:#fff;border-radius:18px;min-height:0;overflow:hidden">
    <canvas id="drawCanvas"></canvas>
  </div>
  <div class="palette" id="palDraw"></div>
</div>

<!-- Friends ----------------------------------------------------------- -->
<div class="screen" id="s-pets">
  <div class="bar">
    <button class="round" data-go="worlds" aria-label="Inicio">🏠</button>
    <h1 id="petName"></h1>
    <div class="grow"></div>
    <div class="whotabs" id="petWho"></div>
  </div>
  <div class="petsrow">
    <div class="petstage"><svg id="petSvg" viewBox="0 0 300 400" role="img" aria-label="amigo"></svg></div>
    <div class="petside">
      <div class="cats" id="petModes"></div>
      <div class="meter" id="petMeter"><div></div></div>
      <div class="petitems" id="petItems"></div>
      <div class="paintrow">
        <div class="palette" id="petPal"></div>
        <button class="bigreset" id="petReset" aria-label="Empezar de nuevo">
          <svg id="petResetArt" viewBox="30 0 240 240" aria-hidden="true"></svg>
          <span class="badge">↺</span>
        </button>
      </div>
      <p class="pethint" id="petHint"></p>
    </div>
  </div>
</div>

<!-- Camera ------------------------------------------------------------ -->
<div class="screen" id="s-camera">
  <div class="bar">
    <button class="round" data-go="worlds" aria-label="Inicio">🏠</button>
    <div class="grow"></div>
    <button class="round" id="camFlip" aria-label="Cambiar cámara">🔄</button>
  </div>
  <div class="camwrap" id="camWrap">
    <video id="camVideo" playsinline muted autoplay></video>
    <svg id="camOverlay" preserveAspectRatio="none"></svg>
    <div class="camflash" id="camFlash"></div>
    <div class="camshot" id="camShot"></div>
    <p class="camdenied" id="camDenied"></p>
  </div>
  <div class="camrow">
    <div class="camcostumes" id="camCostumes"></div>
    <button class="camshutter" id="camShutter" aria-label="Tomar foto">
      <svg viewBox="0 0 60 60" aria-hidden="true">
        <path d="M30 8 L36 30 L24 30 Z" fill="#fff"/>
        <circle cx="30" cy="40" r="13" fill="#fff"/>
        <circle cx="25" cy="38" r="2.5" fill="#E86A9A"/>
        <circle cx="35" cy="38" r="2.5" fill="#E86A9A"/>
      </svg>
    </button>
  </div>
</div>

<!-- Wolf and the three pigs -------------------------------------------- -->
<div class="screen" id="s-story">
  <div class="bar">
    <button class="round" data-go="worlds" aria-label="Inicio">🏠</button>
    <div class="grow"></div>
    <div class="dots" id="storyDots"></div>
  </div>
  <div class="storywrap"><svg id="storySvg" aria-label="el lobo y los tres cerditos"></svg></div>
  <div class="storyrow">
    <button class="storybtn" id="storyBlow" aria-label="Sopla"></button>
    <button class="storybtn next" id="storyNext" hidden aria-label="Siguiente casa"></button>
  </div>
</div>

<!-- Playing in the forest ---------------------------------------------- -->
<div class="screen" id="s-forest">
  <div class="bar">
    <button class="round" data-go="worlds" aria-label="Inicio">🏠</button>
    <div class="grow"></div>
    <div class="dots" id="forestDots"></div>
  </div>
  <div class="storywrap"><svg id="forestSvg" aria-label="juguemos en el bosque"></svg></div>
  <div class="storyrow">
    <button class="storybtn" id="forestAsk" aria-label="¿Lobo, estás?"></button>
    <button class="storybtn next" id="forestAgain" hidden aria-label="Otra vez"></button>
  </div>
  <p class="foresthint" id="forestHint"></p>
</div>

<!-- Worm ---------------------------------------------------------------- -->
<div class="screen" id="s-worm">
  <div class="bar">
    <button class="round" data-go="worlds" aria-label="Inicio">🏠</button>
    <div class="dots" id="wormDots"></div>
    <div class="grow"></div>
    <button class="round wormrestart" id="wormReset" aria-label="Empezar de nuevo">↺</button>
  </div>
  <div class="wormrow">
    <div class="wormboard"><svg id="wormSvg" aria-label="el gusanito"></svg></div>
    <div class="pad4">
      <button class="dirbtn up"    data-dir="0,-1" aria-label="Arriba">▲</button>
      <button class="dirbtn left"  data-dir="-1,0" aria-label="Izquierda">◀</button>
      <button class="dirbtn right" data-dir="1,0"  aria-label="Derecha">▶</button>
      <button class="dirbtn down"  data-dir="0,1"  aria-label="Abajo">▼</button>
    </div>
  </div>
</div>

<!-- Mosquitos ---------------------------------------------------------- -->
<div class="screen" id="s-bugs">
  <div class="bar">
    <button class="round" data-go="worlds" aria-label="Inicio">🏠</button>
    <div class="dots" id="bugDots"></div>
    <div class="grow"></div>
    <button class="round wormrestart" id="bugReset" aria-label="Empezar de nuevo">↺</button>
  </div>
  <div class="bugwrap">
    <div class="bugboard"><svg id="bugSvg" aria-label="los mosquitos"></svg></div>
    <div class="bugcheer" id="bugCheer" hidden></div>
  </div>
</div>

<!-- Une con la flecha --------------------------------------------------- -->
<div class="screen" id="s-match">
  <div class="bar">
    <button class="round" data-go="worlds" aria-label="Inicio">🏠</button>
    <div class="dots" id="matchDots"></div>
    <div class="grow"></div>
    <button class="round wormrestart" id="matchReset" aria-label="Empezar de nuevo">↺</button>
  </div>
  <div class="matchwrap">
    <div class="matchboard"><svg id="matchSvg" aria-label="une los conjuntos con su numero"></svg></div>
    <div class="bugcheer" id="matchCheer" hidden></div>
  </div>
</div>

<!-- A pescar ------------------------------------------------------------ -->
<div class="screen" id="s-fish">
  <div class="bar">
    <button class="round" data-go="worlds" aria-label="Inicio">🏠</button>
    <div class="dots" id="fishDots"></div>
    <div class="grow"></div>
    <button class="round wormrestart" id="fishReset" aria-label="Empezar de nuevo">↺</button>
  </div>
  <div class="bugwrap">
    <div class="bugboard"><svg id="fishSvg" aria-label="a pescar"></svg></div>
    <div class="bugcheer" id="fishCheer" hidden></div>
  </div>
</div>

<!-- Counting ------------------------------------------------------------ -->
<div class="screen" id="s-count">
  <div class="bar">
    <button class="round" data-go="worlds" aria-label="Inicio">🏠</button>
    <div class="grow"></div>
    <div class="dots" id="countDots"></div>
  </div>
  <div class="countboard" id="countBoard"></div>
  <div class="countrow">
    <div class="numchip" id="numChip"></div>
    <p class="counthint" id="countHint"></p>
  </div>
</div>

<!-- Help ---------------------------------------------------------------- -->
<div class="screen" id="s-help">
  <div class="wrap">
    <div class="bar" style="margin:10px 0 18px">
      <h2 style="margin:0" data-t="help.title"></h2>
      <div class="grow"></div>
      <button class="btn" id="helpBack" data-t="help.done"></button>
    </div>
    <div data-thtml="body"></div>
  </div>
</div>

<!-- PIN --------------------------------------------------------------- -->
<div class="screen" id="s-pin">
  <h2 data-t="pin.title"></h2>
  <div class="pips" id="pips"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pinPad"></div>
  <button class="quiet" id="pinCancel" data-t="pin.cancel"></button>
</div>

<!-- Parent panel ------------------------------------------------------ -->
<div class="screen" id="s-parents">
  <div class="wrap">
    <div class="bar" style="margin:10px 0 18px">
      <h2 style="margin:0" data-t="p.title"></h2>
      <div class="grow"></div>
      <button class="btn" data-go="worlds" data-t="p.done"></button>
    </div>

    <section>
      <h3 data-t="p.help.h"></h3>
      <button class="btn primary" data-go="help" data-t="p.help.link"></button>
      <p class="hint" data-t="p.help.sub"></p>
    </section>

    <!-- The daily limit only counts time spent actually playing a video, so in
         a build without videos it is a control that does nothing. Rather than
         leave a dead setting in front of a parent, it travels with the video
         sections. -->
    <section class="vidonly">
      <h3 data-t="p.time.h"></h3>
      <label><span data-t="p.time.limit"></span>
        <select id="limitSel">
          <option value="0">Sin límite</option>
          <option value="15">15 minutos</option>
          <option value="20">20 minutos</option>
          <option value="30">30 minutos</option>
          <option value="45">45 minutos</option>
          <option value="60">60 minutos</option>
          <option value="90">90 minutos</option>
        </select>
      </label>
      <label><span data-t="p.time.used"></span> <span id="usedToday">0 min</span></label>
      <button class="btn" id="resetTime" data-t="p.time.reset"></button>
    </section>

    <section class="vidonly">
      <h3 data-t="p.search.h"></h3>
      <label><span data-t="p.search.q"></span> <input type="text" id="ytQuery" autocomplete="off"></label>
      <label><span data-t="p.search.world"></span> <select id="ytWorld"></select></label>
      <button class="btn primary" id="ytSearchBtn" data-t="p.search.go"></button>
      <p class="hint" id="ytHint" data-t="p.search.needkey"></p>
      <p class="hint" style="margin-top:12px" data-t="p.search.sugg"></p>
      <div class="suggests" id="ytSuggest"></div>
      <div id="ytResults"></div>
    </section>

    <section class="vidonly">
      <h3 data-t="p.list.h"></h3>
      <label><span data-t="p.list.link"></span> <input type="url" id="ytList" placeholder="https://www.youtube.com/playlist?list=..." autocomplete="off"></label>
      <button class="btn" id="ytListBtn" data-t="p.list.go"></button>
      <p class="hint" data-t="p.list.note"></p>
    </section>

    <section class="vidonly">
      <h3 data-t="p.bulk.h"></h3>
      <textarea id="ytBulk" rows="4" placeholder="Pega aquí varios enlaces, uno por línea"></textarea>
      <button class="btn" id="ytBulkBtn" data-t="p.bulk.go"></button>
      <p class="hint" data-t="p.bulk.note"></p>
    </section>

    <section class="vidonly">
      <h3 data-t="p.add.h"></h3>
      <label><span data-t="p.add.link"></span> <input type="url" id="addLink" placeholder="https://youtu.be/..." inputmode="url" autocomplete="off"></label>
      <label><span data-t="p.add.title"></span> <input type="text" id="addTitle"></label>
      <label><span data-t="p.add.world"></span> <select id="addWorld"></select></label>
      <button class="btn primary" id="addBtn" data-t="p.add.go"></button>
      <p class="hint" id="addHint" data-t="p.add.note"></p>
    </section>

    <section class="vidonly">
      <h3><span data-t="p.videos.h"></span> (<span id="videoCount">0</span>)</h3>
      <div id="videoList"></div>
      <p class="hint" id="emptyHint" data-t="p.videos.empty"></p>
    </section>

    <section>
      <h3 data-t="p.worlds.h"></h3>
      <div id="worldToggles"></div>
      <p class="hint" data-t="p.worlds.note"></p>
    </section>

    <section>
      <h3 data-t="p.lang.h"></h3>
      <div class="cats" id="langPick"></div>
      <p class="hint" data-t="p.lang.note"></p>
    </section>

    <section>
      <h3 data-t="p.theme.h"></h3>
      <div id="themePicker" class="themes"></div>
      <p class="hint" data-t="p.theme.note"></p>
    </section>

    <section class="vidonly">
      <h3 data-t="p.key.h"></h3>
      <label>API key <input type="text" id="ytKey" placeholder="AIza..." autocomplete="off"></label>
      <button class="btn" id="ytKeySave" data-t="p.key.save"></button>
      <p class="hint" data-t="p.key.note"></p>
    </section>

    <section>
      <h3 data-t="p.sec.h"></h3>
      <label>PIN <input type="text" id="pinInput" inputmode="numeric" maxlength="4"></label>
      <button class="btn" id="savePin" data-t="p.sec.save"></button>
      <p class="hint" data-t="p.sec.note"></p>
    </section>

    <section>
      <h3 data-t="p.backup.h"></h3>
      <button class="btn" id="exportBtn" data-t="p.backup.export"></button>
      <button class="btn" id="importBtn" data-t="p.backup.import"></button>
      <p class="hint" data-t="p.backup.note"></p>
      <input type="file" id="importFile" accept="application/json" hidden>
    </section>
  </div>
</div>

<script src="silhouettes.js"></script>
<script src="pets.js"></script>
<script src="camera.js"></script>
<script src="story.js"></script>
<script src="forest.js"></script>
<script src="worm.js"></script>
<script src="counting.js"></script>
<script src="bugs.js"></script>
<script src="match.js"></script>
<script src="fish.js"></script>
<script src="i18n.js"></script>
<script src="i18n-help.js"></script>
<script src="youtube.js"></script>
<script src="app.js"></script>
</body>
</html>
